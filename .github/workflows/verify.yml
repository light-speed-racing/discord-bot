name: Verify Windows release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm install --global yarn@1.22.22
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Yarn' }
          yarn install --frozen-lockfile --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }

      - name: Typecheck
        run: npx tsc --noEmit --incremental false

      - name: Test
        env:
          POWERSHELL_BINARY: powershell.exe
        run: npm test

      - name: Lint tests and changed application code
        run: npx eslint "test/**/*.ts" src/health/health.controller.ts

      - name: Build
        run: npm run build

      - name: Package release without configuration secrets
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'bot-package'
          $windowsScripts = Join-Path $package 'scripts/windows'
          New-Item -ItemType Directory -Path $windowsScripts -Force | Out-Null
          Copy-Item -LiteralPath dist -Destination $package -Recurse
          Copy-Item -LiteralPath package.json,yarn.lock -Destination $package
          Copy-Item -Path scripts/windows/* -Destination $windowsScripts
          @{ releaseId = $env:GITHUB_SHA } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $package 'release.json') -Encoding utf8NoBOM
          foreach ($required in @('dist/main.js', 'dist/data/acc-lfm-bop.json', 'scripts/windows/Deploy-Bot.ps1', 'scripts/windows/Run-Bot.js')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required) -PathType Leaf)) { throw "Package is missing $required" }
          }
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'release.zip')

      - name: Upload tested release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-bot-${{ github.sha }}
          path: ${{ runner.temp }}/release.zip
          if-no-files-found: error
          retention-days: 7
