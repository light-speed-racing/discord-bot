name: Deploy Windows bot

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-production-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && vars.WINDOWS_DEPLOY_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout deployment transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-bot-${{ github.sha }}
          path: ${{ runner.temp }}/bot-artifact

      - name: Deploy and verify Windows scheduled task
        shell: pwsh
        env:
          PATTY_HOST: ${{ secrets.PATTY_HOST }}
          PATTY_USERNAME: ${{ secrets.PATTY_USERNAME }}
          PATTY_PORT: ${{ secrets.PATTY_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BOT_PORT: ${{ secrets.BOT_PORT }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD__GUILD_ID: ${{ secrets.DISCORD__GUILD_ID }}
          DISCORD__LOGGING_CHANNEL_ID: ${{ secrets.DISCORD__LOGGING_CHANNEL_ID }}
          DISCORD__WEATHER_UPDATE_CHANNEL_ID: ${{ secrets.DISCORD__WEATHER_UPDATE_CHANNEL_ID }}
          DATABASE__HOST: ${{ secrets.DATABASE__HOST }}
          DATABASE__PORT: ${{ secrets.DATABASE__PORT }}
          DATABASE__USERNAME: ${{ secrets.DATABASE__USERNAME }}
          DATABASE__PASSWORD: ${{ secrets.DATABASE__PASSWORD }}
          DATABASE__DATABASE_NAME: ${{ secrets.DATABASE__DATABASE_NAME }}
          GIPHY__APIKEY: ${{ secrets.GIPHY__APIKEY }}
          SIMGRID__URL: ${{ secrets.SIMGRID__URL }}
          SIMGRID__TOKEN: ${{ secrets.SIMGRID__TOKEN }}
          OPENGAMEPANEL__IP: ${{ secrets.OPENGAMEPANEL__IP }}
          OPENGAMEPANEL__API_TOKEN: ${{ secrets.OPENGAMEPANEL__API_TOKEN }}
          OPENGAMEPANEL__AUTHORIZATION_TOKEN: ${{ secrets.OPENGAMEPANEL__AUTHORIZATION_TOKEN }}
          OPENWEATHERAPI__TOKEN: ${{ secrets.OPENWEATHERAPI__TOKEN }}
          OPENAI__APIKEY: ${{ secrets.OPENAI__APIKEY }}
          WINDOWS_BOT_PATH: ${{ vars.WINDOWS_BOT_PATH }}
          DEPLOY_RELEASE_ID: ${{ github.sha }}
        run: |
          ./scripts/github/Invoke-WindowsDeployment.ps1 `
            -ArchivePath (Join-Path $env:RUNNER_TEMP 'bot-artifact/release.zip') `
            -ReleaseId $env:DEPLOY_RELEASE_ID `
            -BotPath $env:WINDOWS_BOT_PATH
